spring.application.name=incentivos-service
spring.threads.virtual.enabled=true
spring.main.allow-bean-definition-overriding=true

server.servlet.context-path=/api

server.port=${SERVER_PORT:8084}
servicio.donaciones.url=${DONACIONES_URL:http://localhost:8085}
servicio.notificaciones.url=${NOTIFICACIONES_URL:http://notificaciones-service:8083/}
servicio.n8n.url=${N8N_URL:http://localhost:8082/webhook/incentivos}

# --- Persistencia (MySQL) ---
# Los valores reales de DB_URL / DB_USERNAME / DB_PASSWORD se cargan desde el .env local (ver .env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/incentivos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:incentivos_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En desarrollo: Hibernate actualiza el esquema automáticamente en base a las entidades @Entity.
# Ir a Flyway/Liquibase más adelante si el TP lo requiere.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.security.user.name=admin
spring.security.user.password=admin123
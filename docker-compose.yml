# Infraestructura y servicios del TPA.
#
# Antes este archivo declaraba los cuatro servicios con `image:` y sin MySQL ni broker:
# los contenedores no se podían construir desde el repo y no había base de datos ni cola que
# los sostuviera. Ahora MySQL y RabbitMQ son servicios del compose y cada microservicio se
# construye desde su módulo con `build:`.
#
# La cadena de integración que exige el enunciado va por RabbitMQ, no por HTTP entre
# contenedores: `donaciones-service` publica en `logistica.exchange`, `logisticas-service`
# publica en `logistica.eventos.exchange`, y los dos servicios de dominio publican en
# `notificaciones.exchange`. Todos son consumidores de esas colas.

services:

  # --- Infraestructura ---

  mysql:
    image: mysql:8.0
    container_name: tpa-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tpa-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # consola web de administración
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

      # El reparto del trabajo entre instancias de logistica usa un exchange
      # consistent-hash, que NO es parte del nucleo de RabbitMQ: es un plugin y viene
      # deshabilitado. Sin esta linea, logisticas no arranca con
      # PRECONDITION_FAILED - unknown exchange type 'x-consistent-hash'.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_plugins [rabbitmq_consistent_hash_exchange].
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Servicios de dominio ---
  #
  # Ninguno declara `container_name` a proposito: un nombre fijo impide correr `--scale`, porque
  # no se pueden crear N contenedores con el mismo nombre. Es la razon por la que el
  # "docker compose up --scale logisticas-service=2" que decia el comentario de abajo no
  # funcionaba. Ver el punto 24 del backlog de logisticas-service.
  #
  # mysql y rabbitmq si lo tienen: no se escalan y un nombre estable evita depender de la red de
  # Docker para llegar a ellos.

  notificaciones-service:
    build: ./notificaciones-service
    ports:
      - "8083"
    environment:
      SERVER_PORT: 8083
      # Con context-path /api, la ruta real del controller es /api/notificaciones.
      DB_URL: jdbc:mysql://mysql:3306/notificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: marcelo
      DB_PASSWORD: losbabasonicos
      # Rabbit es el canal de entrada: sin esto, dentro del contenedor el servicio busca
      # localhost y no encuentra al broker.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      N8N_URL: http://host.docker.internal:5678/webhook/notificaciones
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  incentivos-service:
    build: ./incentivos-service
    ports:
      - "8082"
    environment:
      SERVER_PORT: 8082
      #no lleva context-path: las rutas ya empiezan con /api.
      DONACIONES_URL: http://donaciones-service:8084
      NOTIFICACIONES_URL: http://notificaciones-service:8083/api
      N8N_URL: http://host.docker.internal:5678/webhook/incentivos
      DB_URL: jdbc:mysql://mysql:3306/incentivos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: incentivos_user
      DB_PASSWORD: ""
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      mysql:
        condition: service_healthy
      notificaciones-service:
        condition: service_started

  # Es el broker de integración del enunciado: publica las donaciones asignadas para
  # logística y consume los eventos de trazabilidad para notificar.
  donaciones-service:
    build: ./donaciones-service
    ports:
      - "8084"
    environment:
      SERVER_PORT: 8084
      NOTIFICACIONES_URL: http://notificaciones-service:8083/api
      INCENTIVOS_URL: http://incentivos-service:8082
      LOGISTICAS_URL: http://logisticas-service:8086/api
      DB_URL: jdbc:mysql://mysql:3306/donaciones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: valentin
      DB_PASSWORD: "10032001"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Compite por la cola compartida `logistica.integracion.queue`: para cumplir el
  # "más de un servicio de logística disponible" del enunciado basta con escalar este servicio.
  #
  #   docker compose up --scale logisticas-service=2
  #
  # El puerto se publica SIN número de host, o sea efímero, porque un `"8086:8086"` fijo no se
  # puede reservar dos veces y la segunda instancia fallaría con `port is already allocated`.
  # Para descubrir el puerto asignado de cada una:
  #
  #   docker compose port logisticas-service 8086
  #
  # El `SERVER_PORT` de adentro es el mismo para todas: dentro de la red de Docker cada
  # contenedor tiene su propio espacio de puertos, así que 8086 no se repite. El que se repite
  # es el del host, y por eso no se publica fijo.
  #
  # Si se levanta de a una sola instancia, se puede volver a `"8086:8086"` para tener el puerto
  # fijo en localhost, que es lo cómodo para desarrollo.
  #
  # No hay LOGISTICA_SHARDS_ASIGNADAS: todas las instancias escuchan la misma cola. El
  # reparto en varias colas por hash existe y esta documentado en
  # logisticas-service/src/main/resources/application.properties, pero apagado a proposito:
  # compra orden por donacion a cambio de disponibilidad, y hoy ningun mensaje que llegue a
  # logistica lleva una transicion de estado, asi que el orden no hace falta.
  logisticas-service:
    build: ./logisticas-service
    ports:
      - "8086"
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:mysql://mysql:3306/logisticas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: valentin
      DB_PASSWORD: "10032001"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  rabbit-data:

$kind: http-request
description: EntidadBeneficiaria.verDonaciones() recorre las necesidades de la entidad y junta las donaciones de cada una -- por eso el paso 04 (crear la necesidad) es necesario antes de asignar, sin eso esta lista quedaria vacia.
url: "{{baseUrl}}/api/entidades/{{entidadId}}/donaciones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('devuelve las donaciones asignadas a la entidad', function () { pm.response.to.have.status(200); });

      const donacionesRaw = pm.response.json();
      const donaciones = Array.isArray(donacionesRaw) ? donacionesRaw : (donacionesRaw && donacionesRaw.content ? donacionesRaw.content : []);
      const donacionId = pm.collectionVariables.get('donacionId');
      const donacion = Array.isArray(donaciones) ? donaciones.find(function (d) { return d.id === donacionId; }) : undefined;

      pm.test('la donacion del flujo aparece asignada a la entidad', function () {
          pm.expect(donacion).to.not.be.undefined;
      });

      if (donacion) {
          pm.test('la donacion quedo en estado ASIGNADO', function () {
              pm.expect(donacion.estado).to.eql('ASIGNADO');
          });
      }
    language: text/javascript
order: 9000

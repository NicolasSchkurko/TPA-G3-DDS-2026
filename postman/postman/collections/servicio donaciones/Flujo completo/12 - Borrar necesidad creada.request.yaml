$kind: http-request
description: EntidadBeneficiaria.necesidades no tiene CascadeType.REMOVE/orphanRemoval, asi que hay que borrar la necesidad a mano antes de borrar la entidad.
url: "{{baseUrl}}/api/entidades/{{entidadId}}/necesidades/{{necesidadId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('elimina la necesidad', function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 12000

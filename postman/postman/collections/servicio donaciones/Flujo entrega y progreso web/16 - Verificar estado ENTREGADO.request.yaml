$kind: http-request
description: Reintenta la consulta hasta que RabbitMQ propague ENTREGADO a donaciones-service.
url: http://localhost:8084/api/donaciones/{{donacionId}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      const nombre = '16 - Verificar estado ENTREGADO';
      const intento = Number(pm.collectionVariables.get('intentosVerificarEntrega') || 0);
      if (pm.response.code === 200 && pm.response.json().estado === 'ENTREGADO') {
          pm.collectionVariables.set('intentosVerificarEntrega', 0);
          pm.test('la donación quedó ENTREGADO', function () { pm.expect(pm.response.json().estado).to.eql('ENTREGADO'); });
      } else if (pm.response.code === 200 && intento < 20) {
          pm.collectionVariables.set('intentosVerificarEntrega', intento + 1);
          pm.execution.setNextRequest(nombre);
          pm.test('RabbitMQ todavía propaga la entrega', function () { pm.expect(true).to.eql(true); });
      } else {
          pm.collectionVariables.set('intentosVerificarEntrega', 0);
          pm.test('la donación alcanzó ENTREGADO', function () {
              pm.response.to.have.status(200);
              pm.expect(pm.response.json().estado).to.eql('ENTREGADO');
          });
      }
    language: text/javascript
order: 16000

$kind: http-request
description: Los admins no tienen FK desde donaciones/entidades, pero se dejan al final por prolijidad.
url: "{{baseUrl}}/api/admins"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('obtiene la lista de administradores', function () { pm.response.to.have.status(200); });

      const baseUrl = pm.collectionVariables.get('baseUrl');
      const admins = pm.response.json();

      if (Array.isArray(admins)) {
          admins.forEach(function (admin) {
              pm.sendRequest({
                  url: baseUrl + '/api/admins/' + admin.id,
                  method: 'DELETE'
              }, function (err, res) {
                  console.log('admin ' + admin.id + ' -> ' + (res ? res.code : err));
              });
          });
      }

      pm.test('dispara el borrado de ' + admins.length + ' administrador(es)', function () { pm.expect(true).to.be.true; });
    language: text/javascript
order: 5000

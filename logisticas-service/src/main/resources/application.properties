spring.application.name=logisticas-service
spring.threads.virtual.enabled=true

server.servlet.context-path=/api
# SERVER_PORT y no PORT: docker-compose.yml pasa SERVER_PORT a los cuatro servicios, y con
# ${PORT} esta linea descartaria la variable. No se notaba porque el default coincide con lo
# que pasa el compose, pero en cuanto haga falta correr dos instancias de logistica en el mismo
# host -que es el "mas de un servicio de logistica" del enunciado- el puerto se ignoraria y las
# dos pelarian por el mismo.
server.port=${SERVER_PORT:8086}

# Base de datos
#
# SIN default a proposito: las credenciales viven en el `.env` de la raiz del repo, que Docker
# Compose lee solo y que el .gitignore mantiene afuera. Antes estas dos lineas traian la
# credencial real como default, y cualquier arranque sin las variables —un `java -jar` a secas,
# un deploy que se olvido de definirlas— conectaba igual, en claro y sin avisar. Ahora, si
# faltan, el servicio no levanta: que es lo correcto, porque un despliegue que arranca con la
# credencial de otro es peor que uno que no arranca.
#
# La credencial que estaba escrita sigue en el historial de git, asi que hay que rotarla.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/logisticas}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# configuracion RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Que hacer con un mensaje que el listener no pudo procesar.
#
# Sin esto rige el default de Spring AMQP, que es reencolar: el mensaje vuelve a la cola y
# vuelve a entrar. Con una cola compartida, un solo mensaje malformado vuelve a fallar para
# siempre y frena el reparto de todas las instancias, y la dead letter que las colas declaran
# nunca recibe nada, porque el dead letter solo se activa con un rechazo SIN requeue.
#
# En false, lo que el listener descarta va a la DLQ de verdad. Los reintentos con espera los hace
# el propio DonacionListener antes de rendirse, que es donde corresponde: asi el numero de
# intentos es configurable y no queda atado a la politica del contenedor.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reparto del trabajo entre varias instancias de logistica.
#
# APAGADO POR DEFECTO, y esa es la decision. Sin esto todas las instancias escuchan la
# misma cola: si una se cae, las demas siguen consumiendo y no se traba nada.
#
# Prendelo solo cuando exista un mensaje con una transicion de estado, porque el reparto
# compra orden por donacion a cambio de disponibilidad. Hoy el unico mensaje que llega es un
# alta idempotente (donaciones.creada): no lleva transicion, asi que el orden no se necesita.
#
# Con una sola instancia no hay que configurar nada: atiende la cola unica.
#
# Con particionado, repartir el total de forma DISJUNTA entre las instancias:
#   instancia 1 -> LOGISTICA_SHARDS_ASIGNADAS=0,1
#   instancia 2 -> LOGISTICA_SHARDS_ASIGNADAS=2,3
# Si dos instancias atendieran la misma cola, dos mensajes de la misma donacion podrian
# procesarse en paralelo y al reves.
logistica.shards.total=${LOGISTICA_SHARDS_TOTAL:4}
logistica.shards.asignadas=${LOGISTICA_SHARDS_ASIGNADAS:}

# Reintentos antes de mandar el mensaje a la cola de mensajes muertos.
#
# Un fallo de infraestructura (la base tardo, se corto la conexion) se reintenta con espera en
# lugar de rendirse al primer error. Los errores de negocio y la carrera de clave primaria NO
# se reintentan: fallan igual todas las veces y reintentarlos solo frena la cola compartida.
logistica.reintentos=${LOGISTICA_REINTENTOS:3}
logistica.espera-reintento-ms=${LOGISTICA_ESPERA_REINTENTO_MS:2000}

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Con context-path /api, la URL final de la UI es /api/api-docs.
springdoc.swagger-ui.path=/api-docs
# JSON de especificacion OpenAPI; URL final /api/v3/api-docs.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT:8083}

# El webhook de n8n. El default tiene que ser el endpoint completo: con
# http://localhost:5678/webhook/ pelado el POST devuelve 404 y cada notificacion queda
# en FALLIDA sin que nada en el log diga que la URL esta mal.
servicio.n8n.url=${N8N_URL:http://localhost:5678/webhook/notificaciones}

# --- Persistencia (MySQL) ---
# Parametrizada por las mismas variables que los otros tres modulos. Esto no es cosmetico:
# docker-compose.yml pasa DB_URL apuntando al contenedor mysql, y si esta linea fuera literal
# el servicio ignoraria la variable, buscaria la base en localhost -o sea en si mismo- y no
# levantaria.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:marcelo}
spring.datasource.password=${DB_PASSWORD:losbabasonicos}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forzar el dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Generación automática de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# RabbitMQ. Es el canal de salida de las notificaciones: el enunciado pide que la
# integracion con el servicio de notificaciones sea asincrona por cola de mensajes.
# Sin estas propiedades, dentro de un contenedor el servicio buscaria localhost y no
# encontraria al broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Que hace el listener cuando un mensaje falla.
#
# default-requeue-rejected=false es la clave: con el default (true) el mensaje rechazado vuelve
# a la cola y se reintenta para siempre (un error de conversion genero 1.9 GB de log). Con false,
# lo rechazado va al dead letter exchange que declara RabbitConfig y termina en la cola
# "notificaciones.dlq".
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reintento acotado para lo que puede ser transitorio: 3 intentos con espera creciente. Si los
# agota, el RejectAndDontRequeueRecoverer rechaza el mensaje y lo deriva a la DLQ.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Con context-path /api, la URL final de la UI es /api/api-docs.
springdoc.swagger-ui.path=/api-docs
# JSON de especificacion OpenAPI; URL final /api/v3/api-docs.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true
server.servlet.context-path=/api
server.port=${SERVER_PORT:8083}
# El webhook de n8n. El default tiene que ser el endpoint completo: con
# http://localhost:5678/webhook/ pelado el POST devuelve 404 y cada notificacion queda
# en FALLIDA sin que nada en el log diga que la URL esta mal.
servicio.n8n.url=${N8N_URL:http://localhost:5678/webhook/notificaciones}
# --- Persistencia (MySQL) ---
# Parametrizada por las mismas variables que los otros tres modulos. Esto no es cosmetico:
# docker-compose.yml pasa DB_URL apuntando al contenedor mysql, y si esta linea fuera literal
# el servicio ignoraria la variable, buscaria la base en localhost -o sea en si mismo- y no
# levantaria.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Forzar el dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Generación automática de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# RabbitMQ. Es el canal de salida de las notificaciones: el enunciado pide que la
# integracion con el servicio de notificaciones sea asincrona por cola de mensajes.
# Sin estas propiedades, dentro de un contenedor el servicio buscaria localhost y no
# encontraria al broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

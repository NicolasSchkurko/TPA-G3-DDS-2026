spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true
server.servlet.context-path=/api
server.port=${SERVER_PORT:8083}

servicio.n8n.url=${N8N_URL:http://localhost:5678/webhook/}

spring.datasource.url=jdbc:mysql://localhost:3306/notificaciones?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=marcelo
spring.datasource.password=losbabasonicos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forzar el dialecto de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Generación automática de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# RabbitMQ. Es el canal de salida de las notificaciones: el enunciado pide que la
# integracion con el servicio de notificaciones sea asincrona por cola de mensajes.
# Sin estas propiedades, dentro de un contenedor el servicio buscaria localhost y no
# encontraria al broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

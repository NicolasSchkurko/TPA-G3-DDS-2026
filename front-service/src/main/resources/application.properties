spring.application.name=front-service
# Carga el .env local (si existe) como properties, para no duplicar la key del mapa.
spring.config.import=optional:file:./.env[.properties],optional:file:./front-service/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=true

# Desactivar caché de plantillas para desarrollo (permite ver cambios en el HTML sin recompilar)
spring.thymeleaf.cache=false

# URLs base para consumir los microservicios
servicio.donaciones.url=${DONACIONES_URL:http://localhost:8084}
servicio.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
servicio.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8083/api}
servicio.logisticas.url=${LOGISTICAS_URL:http://localhost:8086/api}

# Mapa de la landing. Por defecto usa Esri Light Gray (no requiere API key).
# Para CARTO, configurar por ejemplo:
# MAPA_TILES_URL=https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png?key=TU_KEY
# MAPA_ATTRIBUTION=© OpenStreetMap contributors, © CARTO
servicio.mapa.tiles-url=${MAPA_TILES_URL:}
servicio.mapa.attribution=${MAPA_ATTRIBUTION:}

spring.application.name=front-service
# Carga el .env local (si existe) como properties, para no duplicar la key del mapa.
spring.config.import=optional:file:./.env[.properties],optional:file:./front-service/.env[.properties]
server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=true

# Desactivar caché de plantillas para desarrollo (permite ver cambios en el HTML sin recompilar)
spring.thymeleaf.cache=false

# URLs base para consumir los microservicios
servicio.donaciones.url=${DONACIONES_URL:http://localhost:8084}
servicio.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
servicio.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8083/api}
servicio.logisticas.url=${LOGISTICAS_URL:http://localhost:8086/api}

# OpenID Connect / Keycloak. Browser-facing and Docker-internal URLs are separate:
# the issuer identifies tokens, while backchannel endpoints are resolved by the front container.
keycloak.client-id=${KEYCLOAK_CLIENT_ID:front-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:front-service-dev-secret}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ddsi}
keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8180/realms/ddsi/protocol/openid-connect/auth}
keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ddsi/protocol/openid-connect/token}
keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ddsi/protocol/openid-connect/certs}
keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:http://localhost:8180/realms/ddsi/protocol/openid-connect/userinfo}
keycloak.logout-uri=${KEYCLOAK_LOGOUT_URI:http://localhost:8180/realms/ddsi/protocol/openid-connect/logout}
keycloak.post-logout-redirect-uri=${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:http://localhost:8080/}
# Cliente de servicio usado exclusivamente por el backend para provisionar cuentas.
keycloak.realm=${KEYCLOAK_REALM:ddsi}
keycloak.admin-base-uri=${KEYCLOAK_ADMIN_BASE_URI:http://localhost:8180/admin}
keycloak.registration-client-id=${KEYCLOAK_REGISTRATION_CLIENT_ID:front-registration}
keycloak.registration-client-secret=${KEYCLOAK_REGISTRATION_CLIENT_SECRET:front-registration-dev-secret}
keycloak.account-return-uri=${KEYCLOAK_ACCOUNT_RETURN_URI:http://localhost:8080/donante/mapa}


# Portal de entidad
front.entidad.mapping-file=./data/identidad-usuarios.json
front.polling.seguimiento-ms=12000
server.tomcat.max-http-form-post-size=10MB

# Importación de donantes por CSV (/admin/donantes). El default de Spring es 1MB por archivo,
# muy poco para un padrón de donantes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donación realizada — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-4">
<main class="container">
    <section class="static-card border-0 mx-auto text-center" style="max-width: 600px;" aria-labelledby="titulo">
        <div class="card-body p-4 p-md-5">
            <div class="text-success mb-3" aria-hidden="true">
                <i class="bi bi-check-circle-fill" style="font-size: 4rem;"></i>
            </div>
            <h1 id="titulo" class="h3 fw-bold mb-3">¡Donación realizada correctamente!</h1>
            <p class="text-muted mb-4">Gracias por tu generosidad. Tu donación fue registrada.</p>
            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                <a class="btn btn-primary" th:href="@{/realizar-donacion}">
                    <i class="bi bi-heart-fill me-1" aria-hidden="true"></i> Crear otra donación
                </a>
                <a class="btn btn-outline-secondary" th:href="@{/}">
                    <i class="bi bi-house me-1" aria-hidden="true"></i> Volver al inicio
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

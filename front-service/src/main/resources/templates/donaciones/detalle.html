<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Donación — DDSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="mb-4">
            <a th:href="@{/donaciones}" class="btn btn-outline-secondary btn-sm mb-2">
                <i class="bi bi-arrow-left me-1"></i> Volver al listado
            </a>
            <h2 class="fw-bold">Detalle de Donación</h2>
        </div>

        <div class="card border-0 shadow-sm" th:if="${donacion != null}">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold" th:text="${donacion.descripcion}">Descripción</h5>
                <span class="badge bg-primary fs-6" th:text="${donacion.estado}">ESTADO</span>
            </div>
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-3 text-muted">ID:</dt>
                    <dd class="col-sm-9"><code th:text="${donacion.id}">UUID</code></dd>

                    <dt class="col-sm-3 text-muted">Donante:</dt>
                    <dd class="col-sm-9 fw-semibold" th:text="${donacion.donanteName ?: 'Anónimo'}">-</dd>

                    <dt class="col-sm-3 text-muted">Entidad Beneficiaria:</dt>
                    <dd class="col-sm-9" th:text="${donacion.entidadBeneficiaria ?: 'No asignada aún'}">-</dd>

                    <dt class="col-sm-3 text-muted">Categoría de Bien:</dt>
                    <dd class="col-sm-9" th:text="${donacion.categoriaBienName ?: '-'}">-</dd>

                    <dt class="col-sm-3 text-muted">Subcategoría:</dt>
                    <dd class="col-sm-9" th:text="${donacion.subcategoriaName ?: '-'}">-</dd>

                    <dt class="col-sm-3 text-muted">Cantidad total de bienes:</dt>
                    <dd class="col-sm-9" th:text="${donacion.cantidadTotalBienes ?: '-'}">-</dd>

                    <dt class="col-sm-3 text-muted">Fecha Estimada de Entrega:</dt>
                    <dd class="col-sm-9" th:text="${donacion.fechaEntrega ?: 'Sin fecha'}">-</dd>
                </dl>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

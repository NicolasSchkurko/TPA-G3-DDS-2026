<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Donaciones — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app">

    <div th:replace="~{fragments/app-shell :: appHeader}"></div>

    <main class="container my-4" id="contenido" tabindex="-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h2 fw-bold mb-1"><i class="bi bi-gift me-2 text-primary"></i>Listado de donaciones</h1>
                <p class="text-muted mb-0">Donaciones registradas en el sistema y su estado actual</p>
            </div>
            <a th:href="@{/}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al inicio
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Descripción</th>
                                <th>Donante</th>
                                <th>Entidad beneficiaria</th>
                                <th>Estado</th>
                                <th>Categoría</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(donaciones)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    Todavía no hay donaciones registradas.
                                </td>
                            </tr>
                            <tr th:each="donacion : ${donaciones}">
                                <td>
                                    <span class="badge bg-secondary font-monospace" th:text="${#strings.substring(donacion.id.toString(), 0, 8)}">id</span>
                                </td>
                                <td class="fw-semibold" th:text="${donacion.descripcion}">Descripción</td>
                                <td th:text="${donacion.donanteName ?: 'Anónimo'}">Donante</td>
                                <td th:text="${donacion.entidadBeneficiaria ?: 'Sin asignar'}">Entidad</td>
                                <td>
                                    <span class="badge bg-primary" th:text="${donacion.estado}">ESTADO</span>
                                </td>
                                <td th:text="${donacion.categoriaBienName ?: '-'}">Categoría</td>
                                <td>
                                    <a th:href="@{/donaciones/{id}(id=${donacion.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> Ver donación
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

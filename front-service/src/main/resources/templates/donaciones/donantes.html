<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donantes — DDSI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-people me-2 text-success"></i>Listado de Donantes</h2>
                <p class="text-muted mb-0">Personas donantes registradas en el sistema</p>
            </div>
            <a th:href="@{/}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Usuario</th>
                                <th>Nombre y Apellido</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(donantes)}">
                                <td colspan="4" class="text-center py-4 text-muted">
                                    <i class="bi bi-people fs-3 d-block mb-2"></i>
                                    No hay donantes registrados (o el servicio no está respondiendo).
                                </td>
                            </tr>
                            <tr th:each="donante : ${donantes}">
                                <td class="fw-semibold">
                                    <span class="badge bg-success me-1"><i class="bi bi-person"></i></span>
                                    <span th:text="${donante.nombreDeUsuario ?: '-'}">user</span>
                                </td>
                                <td th:text="${(donante.nombre ?: '') + ' ' + (donante.apellido ?: '')}">Nombre Apellido</td>
                                <td>
                                    <a th:if="${donante.correoElectronico}" th:href="'mailto:' + ${donante.correoElectronico}" th:text="${donante.correoElectronico}">mail@example.com</a>
                                    <span th:unless="${donante.correoElectronico}" class="text-muted">-</span>
                                </td>
                                <td th:text="${donante.telefono ?: '-'}">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${donacion.descripcion} + ' — DonaTrack'">Detalle de donación — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/detalle-donacion.css}">
</head>
<body class="bg-light">
    <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

    <main class="container pb-5">
        <article class="static-card shadow-sm border-0 donation-detail-card">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/donaciones}" aria-label="Volver a donaciones">
                        <i class="bi bi-arrow-left" aria-hidden="true"></i>
                        <span class="visually-hidden">Volver</span>
                    </a>
                    <time class="text-muted small" th:if="${donacion.fechaEntrega != null}"
                          th:text="${donacion.fechaEntrega}">04/07/26</time>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <h1 class="h2 fw-semibold mb-0"
                        th:text="${donacion.descripcion != null and !#strings.isEmpty(donacion.descripcion) ? donacion.descripcion : 'Donación'}">
                        Donación
                    </h1>
                    <span class="badge rounded-pill text-bg-secondary px-3 py-2"
                          th:text="${donacion.estado != null ? #strings.replace(#strings.toLowerCase(donacion.estado), '_', ' ') : 'Sin estado'}">
                        En preparación
                    </span>
                </div>

                <div class="d-flex flex-wrap gap-3 mb-4">
                    <section class="donation-party border rounded p-3">
                        <h2 class="small text-muted mb-2">Donante</h2>
                        <p class="h5 mb-0"
                           th:text="${donacion.donanteName != null and !#strings.isEmpty(donacion.donanteName) ? donacion.donanteName : 'No informado'}">
                            Donador
                        </p>
                    </section>
                    <section class="donation-party border rounded p-3">
                        <h2 class="small text-muted mb-2">Entidad</h2>
                        <p class="h5 mb-0"
                           th:text="${donacion.entidadBeneficiaria != null and !#strings.isEmpty(donacion.entidadBeneficiaria) ? donacion.entidadBeneficiaria : 'No asignada'}">
                            No asignada
                        </p>
                    </section>
                </div>

                <section aria-labelledby="productsTitle">
                    <h2 id="productsTitle" class="h5 fw-semibold mb-3">Productos de la donación</h2>
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3" id="categoryFilters"
                         aria-label="Filtrar productos por categoría">
                        <button class="category-filter" type="button" data-category="all" aria-pressed="true">
                            <span class="category-filter-dot" aria-hidden="true"></span>
                            <span>Seleccionar todo</span>
                        </button>
                        <button class="category-filter" type="button"
                                th:if="${donacion.categoriaBienName != null and !#strings.isEmpty(donacion.categoriaBienName)}"
                                th:attr="data-category=${donacion.categoriaBienName}" aria-pressed="false">
                            <span class="category-filter-dot" aria-hidden="true"></span>
                            <span th:text="${donacion.categoriaBienName}">Categoría</span>
                        </button>
                    </div>

                    <div class="border rounded bg-white" id="donationProducts">
                        <div class="donation-product-row"
                             th:if="${donacion.subcategoriaName != null or donacion.descripcion != null}"
                             th:attr="data-category=${donacion.categoriaBienName != null ? donacion.categoriaBienName : ''}">
                            <span th:text="${donacion.subcategoriaName != null and !#strings.isEmpty(donacion.subcategoriaName) ? donacion.subcategoriaName : donacion.descripcion}">
                                Producto donado
                            </span>
                            <span class="text-muted text-end"
                                  th:text="${donacion.cantidadTotalBienes != null ? donacion.cantidadTotalBienes : 0}">0</span>
                        </div>
                        <p class="text-muted p-3 mb-0"
                           th:if="${donacion.subcategoriaName == null and donacion.descripcion == null}">
                            Esta donación no tiene productos detallados.
                        </p>
                        <p class="text-muted p-3 mb-0 d-none" id="emptyCategoryMessage">
                            No hay productos en esta categoría.
                        </p>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <script>
        const categoryFilters = document.getElementById("categoryFilters");
        const productRows = Array.from(document.querySelectorAll(".donation-product-row"));
        const emptyCategoryMessage = document.getElementById("emptyCategoryMessage");

        categoryFilters.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-category]");
            if (!button) return;

            const category = button.dataset.category;
            let visibleProducts = 0;
            categoryFilters.querySelectorAll("button[data-category]").forEach((filter) => {
                filter.setAttribute("aria-pressed", String(filter === button));
            });
            productRows.forEach((row) => {
                const visible = category === "all" || row.dataset.category === category;
                row.classList.toggle("d-none", !visible);
                if (visible) visibleProducts++;
            });
            emptyCategoryMessage.classList.toggle("d-none", visibleProducts > 0);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

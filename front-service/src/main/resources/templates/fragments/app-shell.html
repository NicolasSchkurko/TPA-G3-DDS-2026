<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!--
  Cabecera global del portal: brand, tabs multi-rol, campana de avisos
  y menú de usuario. Emite sus propios CSS/JS para funcionar en cualquier página.
-->
<th:block th:fragment="appHeader">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app-shell.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <script th:src="@{/js/core/header.js}" defer></script>

    <header class="app-header" role="banner">
        <div class="app-header-inner">
            <a class="brand" th:href="@{/}" aria-label="DDSI Donaciones, ir al inicio">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="brand-name">DDSI</span>
                    <span class="brand-sub">Donaciones</span>
                </span>
            </a>

            <!-- Tabs de rol: solo aparecen los roles que tiene la cuenta -->
            <nav class="role-tabs" aria-label="Cambiar de perfil">
                <form th:each="rol : ${rolesDisponibles}" class="role-tab-form" method="post"
                      th:action="@{/rol/{r}(r=${rol})}">
                    <button type="submit" class="role-tab"
                            th:classappend="${rol == rolActivo ? ' is-active' : ''}"
                            th:attr="aria-current=${rol == rolActivo ? 'page' : null}">
                        <th:block th:switch="${rol}">
                            <svg th:case="'ADMIN'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="M8 .5 1.5 3v4.6c0 4 2.8 7.8 6.5 8.9 3.7-1.1 6.5-4.9 6.5-8.9V3L8 .5z"/>
                            </svg>
                            <svg th:case="'DONANTE'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="M8 13s-5.4-3.2-5.4-7A3 3 0 0 1 8 4a3 3 0 0 1 5.4 2c0 3.8-5.4 7-5.4 7z"/>
                            </svg>
                            <svg th:case="'CHOFER'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h6A1.5 1.5 0 0 1 10 3.5V5h1.1a1.5 1.5 0 0 1 1.17.56l1.43 1.8a1.5 1.5 0 0 1 .3 1v2.14a1.5 1.5 0 0 1-1.5 1.5h-.5a2 2 0 1 1-4 0H6a2 2 0 1 1-4 0H2a1.5 1.5 0 0 1-1-.5z"/>
                            </svg>
                            <svg th:case="'ENTIDAD'" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="M2 13h12M3 13V5l5-3 5 3v8M6 13v-3h4v3M6.5 7h1M8.5 7h1M6.5 9.5h1M8.5 9.5h1"/>
                            </svg>
                        </th:block>
                        <span class="role-tab-label"
                              th:text="${rol == 'ADMIN' ? 'Administración' : (rol == 'DONANTE' ? 'Donante' : (rol == 'CHOFER' ? 'Chofer' : 'Entidad'))}">Entidad</span>
                    </button>
                </form>
                <a th:if="${rolesDisponibles != null and (!rolesDisponibles.contains('DONANTE') or !rolesDisponibles.contains('ENTIDAD'))}"
                   class="role-add" th:href="@{/cuenta/roles}"
                   aria-label="Agregar un rol a tu cuenta">
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 3.5a.5.5 0 0 1 .5.5v3.5H12a.5.5 0 0 1 0 1H8.5V12a.5.5 0 0 1-1 0V8.5H4a.5.5 0 0 1 0-1h3.5V4a.5.5 0 0 1 .5-.5z"/>
                    </svg>
                    <span class="role-add-label">Agregar rol</span>
                </a>
            </nav>

            <div class="header-actions">
                <a th:if="${rolesDisponibles != null and rolesDisponibles.contains('ENTIDAD')}"
                   class="icon-btn" th:href="@{/entidad/notificaciones}"
                   aria-label="Notificaciones de la entidad">
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm6-5V7A6 6 0 0 0 9 1.34V.5a1 1 0 0 0-2 0v.84A6 6 0 0 0 2 7v4l-1.3 2.6a.5.5 0 0 0 .45.66h13.7a.5.5 0 0 0 .45-.66z"/>
                    </svg>
                    <span th:if="${notifNoLeidas != null and notifNoLeidas > 0}"
                          class="icon-btn-badge"
                          th:text="${notifNoLeidas > 99 ? '99+' : notifNoLeidas}">3</span>
                </a>

                <div class="user-menu-wrap">
                    <button class="icon-btn" id="userMenuToggle" type="button"
                            aria-haspopup="true" aria-expanded="false" aria-controls="userMenu"
                            aria-label="Abrir menú de usuario">
                        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4"/>
                        </svg>
                    </button>
                    <div class="user-menu" id="userMenu" role="menu" hidden>
                        <p class="user-menu-title">Sesión iniciada como</p>
                        <p class="user-menu-name" th:text="${usuarioNombre}">usuario</p>
                        <a class="user-menu-link" role="menuitem" th:href="@{/cuenta/roles}">
                            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                <path d="M8 3.5a.5.5 0 0 1 .5.5v3.5H12a.5.5 0 0 1 0 1H8.5V12a.5.5 0 0 1-1 0V8.5H4a.5.5 0 0 1 0-1h3.5V4a.5.5 0 0 1 .5-.5z"/>
                            </svg>
                            Agregar rol
                        </a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" role="menuitem">
                                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                    <path d="M7.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3.5-3.5A.5.5 0 0 1 8.646.354L12.146 3.854a.5.5 0 1 1-.708.708L9.5 2.707V6a.5.5 0 0 1-.5.5h-1c-.276 0-.5-.224-.5-.5v-4a.5.5 0 0 1 .5-.5z" transform="rotate(90 8 8)"/>
                                </svg>
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>
</th:block>

<footer th:fragment="appFooter" class="app-footer">
    <span>© 2026 DDSI · Donaciones</span>
    <nav aria-label="Legales">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/donaciones}">Donaciones</a>
    </nav>
</footer>

</body>
</html>

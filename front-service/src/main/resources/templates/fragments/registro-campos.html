<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<!--
  Secciones de campos compartidas entre el registro público (register.html) y
  la adición de roles desde la cuenta (cuenta/roles.html).

  Cada fragmento acepta {@code oculto} (true/false): cuando es true la sección arranca
  oculta y la muestra el JS de la página según el tipo elegido; cuando es false se
  muestra siempre (páginas de un solo rol).
-->

<section th:fragment="donante(oculto)" class="registration-fields" data-registration="DONANTE"
         th:classappend="${oculto} ? ' d-none' : ''">
    <h5 class="fw-semibold mb-3">Datos del donante</h5>
    <div class="mb-3">
        <label for="tipoPersona" class="form-label">Tipo de persona</label>
        <select class="form-select" id="tipoPersona" name="tipoPersona">
            <option value="HUMANA">Persona humana</option>
            <option value="JURIDICA">Persona jurídica</option>
        </select>
    </div>

    <div data-persona="HUMANA">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="donanteNombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="donanteNombre" name="nombre" autocomplete="given-name">
            </div>
            <div class="col-md-6 mb-3">
                <label for="donanteApellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="donanteApellido" name="apellido" autocomplete="family-name">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="donanteEdad" class="form-label">Edad</label>
                <input type="number" class="form-control" id="donanteEdad" name="edad" min="1">
            </div>
            <div class="col-md-4 mb-3">
                <label for="donanteDocumento" class="form-label">Número de documento</label>
                <input type="number" class="form-control" id="donanteDocumento" name="numeroDeDocumento" min="1">
            </div>
            <div class="col-md-4 mb-3">
                <label for="donanteGenero" class="form-label">Género</label>
                <select class="form-select" id="donanteGenero" name="genero">
                    <option value="MUJER">Mujer</option>
                    <option value="HOMBRE">Hombre</option>
                    <option value="OTRO" selected>Otro</option>
                </select>
            </div>
        </div>
    </div>

    <div data-persona="JURIDICA" class="d-none">
        <div class="mb-3">
            <label for="donanteRazonSocial" class="form-label">Razón social</label>
            <input type="text" class="form-control" id="donanteRazonSocial" name="razonSocial">
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="donanteRubro" class="form-label">Rubro</label>
                <input type="text" class="form-control" id="donanteRubro" name="rubro">
            </div>
            <div class="col-md-4 mb-3">
                <label for="donanteCuit" class="form-label">CUIT</label>
                <input type="text" class="form-control" id="donanteCuit" name="cuit">
            </div>
            <div class="col-md-4 mb-3">
                <label for="donanteTipoJuridico" class="form-label">Tipo jurídico</label>
                <select class="form-select" id="donanteTipoJuridico" name="tipoJuridico">
                    <option value="ONG">ONG</option>
                    <option value="GUBERNAMENTAL">Gubernamental</option>
                    <option value="EMPRESA">Empresa</option>
                    <option value="INSTITUCION">Institución</option>
                </select>
            </div>
        </div>
    </div>

    <h6 class="fw-semibold mt-2">Medio de contacto (opcional)</h6>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="donanteTipoContacto" class="form-label">Tipo</label>
            <select class="form-select" id="donanteTipoContacto" name="tipoContacto">
                <option value="EMAIL">Correo electrónico</option>
                <option value="TELEFONO">Teléfono</option>
                <option value="WHATSAPP">WhatsApp</option>
            </select>
        </div>
        <div class="col-md-8 mb-3">
            <label for="donanteValorContacto" class="form-label">Correo o número</label>
            <input type="text" class="form-control" id="donanteValorContacto" name="valorContacto" autocomplete="email">
        </div>
    </div>
    <h6 class="fw-semibold mt-2">Dirección</h6>
    <div class="row">
        <div class="col-md-8 mb-3">
            <label for="donanteCalle" class="form-label">Calle</label>
            <input type="text" class="form-control" id="donanteCalle" name="calleUno" autocomplete="address-line1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="donanteAltura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="donanteAltura" name="altura" min="1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="donantePiso" class="form-label">Piso</label>
            <input type="number" class="form-control" id="donantePiso" name="piso" min="0">
        </div>
        <div class="col-md-4 mb-3">
            <label for="donanteDepartamento" class="form-label">Departamento</label>
            <input type="text" class="form-control" id="donanteDepartamento" name="departamento">
        </div>
        <div class="col-md-4 mb-3">
            <label for="donanteCiudad" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="donanteCiudad" name="ciudad" autocomplete="address-level2">
        </div>
        <div class="col-md-6 mb-3">
            <label for="donanteProvincia" class="form-label">Provincia</label>
            <input type="text" class="form-control" id="donanteProvincia" name="provincia" autocomplete="address-level1">
        </div>
        <div class="col-md-6 mb-3">
            <label for="donantePais" class="form-label">País</label>
            <input type="text" class="form-control" id="donantePais" name="pais" value="Argentina" autocomplete="country-name">
        </div>
    </div>
</section>

<section th:fragment="entidad(oculto)" class="registration-fields" data-registration="ENTIDAD"
         th:classappend="${oculto} ? ' d-none' : ''">
    <h5 class="fw-semibold mb-3">Datos de la entidad beneficiaria</h5>
    <div class="mb-3">
        <label for="entidadRazonSocial" class="form-label">Razón social</label>
        <input type="text" class="form-control" id="entidadRazonSocial" name="razonSocial">
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="entidadRubro" class="form-label">Rubro</label>
            <input type="text" class="form-control" id="entidadRubro" name="rubro">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadCuit" class="form-label">CUIT</label>
            <input type="text" class="form-control" id="entidadCuit" name="cuit">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadTipoJuridico" class="form-label">Tipo jurídico</label>
            <select class="form-select" id="entidadTipoJuridico" name="tipoJuridico">
                <option value="ONG">ONG</option>
                <option value="GUBERNAMENTAL">Gubernamental</option>
                <option value="EMPRESA">Empresa</option>
                <option value="INSTITUCION">Institución</option>
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label for="entidadTelefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="entidadTelefono" name="telefono" autocomplete="tel">
    </div>
    <h6 class="fw-semibold mt-2">Dirección</h6>
    <div class="row">
        <div class="col-md-8 mb-3">
            <label for="entidadCalle" class="form-label">Calle</label>
            <input type="text" class="form-control" id="entidadCalle" name="calleUno" autocomplete="address-line1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadAltura" class="form-label">Altura</label>
            <input type="number" class="form-control" id="entidadAltura" name="altura" min="1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadPiso" class="form-label">Piso</label>
            <input type="number" class="form-control" id="entidadPiso" name="piso" min="0">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadDepartamento" class="form-label">Departamento</label>
            <input type="text" class="form-control" id="entidadDepartamento" name="departamento">
        </div>
        <div class="col-md-4 mb-3">
            <label for="entidadCiudad" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="entidadCiudad" name="ciudad" autocomplete="address-level2">
        </div>
        <div class="col-md-6 mb-3">
            <label for="entidadProvincia" class="form-label">Provincia</label>
            <input type="text" class="form-control" id="entidadProvincia" name="provincia" autocomplete="address-level1">
        </div>
        <div class="col-md-6 mb-3">
            <label for="entidadPais" class="form-label">País</label>
            <input type="text" class="form-control" id="entidadPais" name="pais" value="Argentina" autocomplete="country-name">
        </div>
    </div>
</section>

<section th:fragment="admin(oculto)" class="registration-fields" data-registration="ADMIN"
         th:classappend="${oculto} ? ' d-none' : ''">
    <h5 class="fw-semibold mb-3">Datos del administrador</h5>
    <div class="mb-3">
        <label for="nombreAMostrar" class="form-label">Nombre a mostrar</label>
        <input type="text" class="form-control" id="nombreAMostrar" name="nombreAMostrar">
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="adminNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="adminNombre" name="nombre">
        </div>
        <div class="col-md-6 mb-3">
            <label for="adminApellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="adminApellido" name="apellido">
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="adminEdad" class="form-label">Edad</label>
            <input type="number" class="form-control" id="adminEdad" name="edad" min="1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="adminDocumento" class="form-label">Número de documento</label>
            <input type="number" class="form-control" id="adminDocumento" name="numeroDeDocumento" min="1">
        </div>
        <div class="col-md-4 mb-3">
            <label for="adminGenero" class="form-label">Género</label>
            <select class="form-select" id="adminGenero" name="genero">
                <option value="MUJER">Mujer</option>
                <option value="HOMBRE">Hombre</option>
                <option value="OTRO" selected>Otro</option>
            </select>
        </div>
    </div>
    <h6 class="fw-semibold mt-2">Medio de contacto</h6>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="adminTipoContacto" class="form-label">Tipo</label>
            <select class="form-select" id="adminTipoContacto" name="tipoContacto">
                <option value="EMAIL">Correo electrónico</option>
                <option value="TELEFONO">Teléfono</option>
                <option value="WHATSAPP">WhatsApp</option>
            </select>
        </div>
        <div class="col-md-8 mb-3">
            <label for="adminValorContacto" class="form-label">Correo o número</label>
            <input type="text" class="form-control" id="adminValorContacto" name="valorContacto" autocomplete="email">
        </div>
    </div>
</section>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <span class="brand-mark brand-mark-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>
                    </svg>
                </span>
                DDSI — Portal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Inicio</a>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/panel}"><i class="bi bi-grid-1x2 me-1"></i>Panel</a>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/donaciones}"><i class="bi bi-gift me-1"></i>Donaciones</a>
                    </li>
                    <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/donaciones/donantes}"><i class="bi bi-people me-1"></i>Donantes</a>
                    </li>
                    <li sec:authorize="hasRole('DONANTE')" class="nav-item">
                        <a class="nav-link" th:href="@{/donante}"><i class="bi bi-person-heart me-1"></i>Donante</a>
                    </li>
                    <li sec:authorize="hasRole('CHOFER')" class="nav-item">
                        <a class="nav-link" th:href="@{/chofer}"><i class="bi bi-truck me-1"></i>Mis rutas</a>
                    </li>
                    <li sec:authorize="hasRole('ENTIDAD')" class="nav-item">
                        <a class="nav-link" th:href="@{/entidad}"><i class="bi bi-building me-1"></i>Mi entidad</a>
                    </li>
                </ul>

                <!-- Usuario autenticado y botón de salir -->
                <div class="d-flex align-items-center gap-3">
                    <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-brand btn-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                    </a>

                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline m-0">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Salir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>

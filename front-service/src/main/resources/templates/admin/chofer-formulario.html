<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Chofer — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<header class="admin-page-head">
    <div>
        <p class="eyebrow">Administración</p>
        <h1 th:text="${edicion} ? 'Editar chofer' : 'Nuevo chofer'">Chofer</h1>
    </div>
    <a class="btn btn-secondary" th:href="@{/admin/choferes}" data-back="true">Volver</a>
</header>

<main class="main-admin" id="contenido" tabindex="-1">
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <form th:action="${edicion} ? @{/admin/choferes/{id}/actualizar(id=${idChofer})} : @{/admin/choferes/nuevo}"
                  th:object="${chofer}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" required>
                    <div class="form-text">Obligatorio. Se usa para crear la cuenta y enviarle la contraseña temporal.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Disponibilidad</label>
                    <select class="form-select" th:field="*{disponible}">
                        <option th:value="true">Disponible</option>
                        <option th:value="false">No disponible</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{activo}">
                        <option th:value="true">Activo</option>
                        <option th:value="false">Inactivo</option>
                    </select>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar camion — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .register-card {
            max-width: 760px;
            margin: auto;
        }

        .register-card .card-body {
            max-height: calc(100vh - 3rem);
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
<div class="container">
    <div class="static-card border-0 register-card">
        <div class="card-body p-4 p-md-5">
            <div class="mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">
                    <i class="bi bi-house me-1" aria-hidden="true"></i> Volver
                </a>
            </div>
            <div class="text-center mb-4">
                <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px;">
                    <i class="bi bi-person-plus fs-3"></i>
                </div>
                <h4 class="fw-bold">DonaTrack — Crear camion</h4>
                <p class="text-muted small">Portal de Camiones</p>
            </div>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">No se pudo completar el registro.</span>
            </div>
            <div th:if="${msg}" class="alert alert-success d-flex align-items-center py-2" role="status">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${msg}">Registro realizado correctamente.</span>
            </div>

            <form th:action="@{/admin/camiones/{patente}(patente=${camion.patente})}"
                  method="post"
                  id="camionForm">

                <input type="hidden" name="_method" value="PUT">

                <div class="row">

                    <!-- Patente -->
                    <div class="col-md-6 mb-3">
                        <label for="patente" class="form-label fw-semibold">Patente</label>
                        <input type="text"
                               class="form-control"
                               id="patente"
                               name="patente"
                               th:value="${camion.patente}"
                               maxlength="10"
                               required>
                    </div>

                    <!-- Volumen -->
                    <div class="col-md-6 mb-3">
                        <label for="capacidadVolumen" class="form-label fw-semibold">
                            Capacidad de volumen
                        </label>
                        <input type="number"
                               class="form-control"
                               id="capacidadVolumen"
                               name="capacidadVolumen"
                               min="0"
                               step="0.01"
                               th:value="${camion.capacidadVolumen}"
                               required>
                    </div>

                    <!-- Altura -->
                    <div class="col-md-6 mb-3">
                        <label for="altura" class="form-label fw-semibold">Altura</label>
                        <input type="number"
                               class="form-control"
                               id="altura"
                               name="altura"
                               min="0"
                               step="0.01"
                               th:value="${camion.altura}"
                               required>
                    </div>

                    <!-- Capacidad de carga -->
                    <div class="col-md-6 mb-3">
                        <label for="capacidadCarga" class="form-label fw-semibold">
                            Capacidad de carga
                        </label>
                        <input type="number"
                               class="form-control"
                               id="capacidadCarga"
                               name="capacidadCarga"
                               min="0"
                               step="0.01"
                               th:value="${camion.capacidadCarga}"
                               required>
                    </div>

                    <!-- Disponible -->
                    <div class="col-md-6 mb-3">
                        <label for="disponible" class="form-label fw-semibold">Estado</label>

                        <select class="form-select" id="disponible" name="disponible" required>
                            <option value="true"
                                    th:selected="${camion.disponible == true}">
                                Disponible
                            </option>

                            <option value="false"
                                    th:selected="${camion.disponible == false}">
                                No disponible
                            </option>
                        </select>
                    </div>

                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a th:href="@{/admin/camiones}"
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-guardar">
                        <i class="bi bi-save me-1"></i>
                        Guardar cambios
                    </button>

                </div>

            </form>
        </div>
    </div>
</div>
</body>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Entregas no recibidas — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>
<header class="admin-page-head">
    <div>
        <p class="eyebrow">Administración</p>
        <h1>Entregas no recibidas</h1>
        <p class="admin-page-lead">Ítems rechazados pendientes de revisión.</p>
    </div>
    <a class="btn btn-secondary" th:href="@{/admin}" data-back="true">Volver al panel</a>
</header>
<main class="main-admin" id="contenido" tabindex="-1">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Donación</th>
                        <th>Cantidad</th>
                        <th>Unidad</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(entregas)}">
                        <td colspan="5" class="text-center py-4 text-muted">No hay entregas no recibidas.</td>
                    </tr>
                    <tr th:each="e : ${entregas}">
                        <td th:text="${e.idDonacion}">id</td>
                        <td th:text="${e.cantidad}">cant</td>
                        <td th:text="${e.unidadDeMedida}">unidad</td>
                        <td th:text="${e.etiquetaEstado()}">estado</td>
                        <td>
                            <form th:action="@{/admin/entregas-no-recibidas/{id}/reingresar(id=${e.idDonacion})}" method="post">
                                <button class="btn btn-sm btn-outline-primary" type="submit">Reingresar</button>
                            </form>
                            <a th:href="@{/admin/donaciones/{id}/editar(id=${e.idDonacion})}" class="btn btn-sm btn-link">Detalle</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

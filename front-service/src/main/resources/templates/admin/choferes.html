<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Choferes — DonaTrack</title>
    <meta name="description" content="Administración de choferes">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>
<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<header class="admin-page-head">
    <div>
        <p class="eyebrow">Administración</p>
        <h1>Choferes</h1>
        <p class="admin-page-lead">Personal de reparto y estado de disponibilidad.</p>
    </div>
    <div class="admin-head-actions">
        <a class="btn btn-primary" th:href="@{/admin/choferes/nuevo}">Nuevo chofer</a>
        <a class="btn btn-secondary" th:href="@{/admin}" data-back="true">Volver al panel</a>
    </div>
</header>

<main class="main-admin" id="contenido" tabindex="-1">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Disponibilidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(choferes)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-person-badge fs-3 d-block mb-2"></i>
                            Todavía no hay choferes registrados.
                        </td>
                    </tr>
                    <tr th:each="chofer : ${choferes}">
                        <td class="fw-semibold" th:text="${chofer.nombre ?: '-'}">Nombre</td>
                        <td th:text="${chofer.email ?: '-'}">Email</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${chofer.disponible == true ? ' text-bg-success' : ' text-bg-secondary'}"
                                  th:text="${chofer.disponible == true ? 'Disponible' : 'No disponible'}">Disponible</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${chofer.activo == false ? ' text-bg-secondary' : ' text-bg-success'}"
                                  th:text="${chofer.activo == false ? 'Inactivo' : 'Activo'}">Activo</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/choferes/{id}/editar(id=${chofer.idChofer})}">Editar</a>
                            <form th:action="@{/admin/choferes/{id}/eliminar(id=${chofer.idChofer})}" method="post" style="display:inline">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

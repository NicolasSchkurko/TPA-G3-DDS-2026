<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choferes — DDSI</title>
    <meta name="description" content="Zona de choferes">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body>
<header class="encabezado">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="text-success"></i>Listado de Choferes</h2>
            <p class="text-muted mb-0">Choferes registrados en el sistema</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>ID</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(choferes)}">
                        <td colspan="3" class="text-center py-4 text-muted">
                            <i class="bi bi-people fs-3 d-block mb-2"></i>
                            No hay choferes registrados (o el servicio no está respondiendo).
                        </td>
                    </tr>
                    <tr th:each="chofer : ${choferes}">
                        <td class="fw-semibold">
                            <span th:text="${chofer.nombre ?: '-'}">Nombre</span>
                        </td>
                        <td th:text="${chofer.idChofer ?: '-'}">ID</td>
                        <td th:text="${chofer.disponible ?: '-'}">Estado</td>
                        <td class="text-center">

                            <!-- Actualizar -->
                            <a th:href="@{/admin/choferes/editar/{id}(id=${chofer.idChofer})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-square"></i> Actualizar
                            </a>

                            <!-- Eliminar -->
                            <form th:action="@{/admin/choferes/{id}(id=${chofer.idChofer})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Estás seguro de que querés eliminar este camión?')">

                                <input type="hidden" name="_method" value="DELETE">

                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </form>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-end mt-4">
        <a th:href="@{/admin/choferes/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-2"></i>Agregar chofer
        </a>
    </div>
</main>

</body>
</html>

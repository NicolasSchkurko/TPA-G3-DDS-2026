<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Camiones — DonaTrack</title>
    <meta name="description" content="Zona de camiones">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<main class="container my-4" id="contenido" tabindex="-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-1">Listado de camiones</h1>
            <p class="text-muted mb-0">Camiones registrados en el sistema</p>
        </div>
        <a th:href="@{/}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver al inicio
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Patente</th>
                        <th>Volumen</th>
                        <th>Altura</th>
                        <th>Capacidad de carga</th>
                        <th>Estado</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(camiones)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-truck fs-3 d-block mb-2"></i>
                            Todavía no hay camiones registrados.
                        </td>
                    </tr>
                    <tr th:each="camion : ${camiones}">
                        <td class="fw-semibold">
                            <span th:text="${camion.patente ?: '-'}">patente</span>
                        </td>
                        <td th:text="${camion.capacidadVolumen ?: '-'}">Volumen</td>
                        <td th:text="${camion.altura ?: '-'}">Altura</td>
                        <td th:text="${camion.capacidadCarga ?: '-'}">Capacidad de carga</td>
                        <td th:text="${camion.disponible ?: '-'}">Estado</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camiones — DDSI</title>
    <meta name="description" content="Zona de camiones">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body>
<header class="encabezado">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="text-success"></i>Listado de Camiones</h2>
            <p class="text-muted mb-0">Camiones registrados en el sistema</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Volver al Inicio
        </a>
    </div>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Chofer asignado</th>
                        <th>Patente</th>
                        <th>Volumen</th>
                        <th>Altura</th>
                        <th>Capacidad de carga</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(camiones)}">
                        <td colspan="7" class="text-center py-4 text-muted">
                            No hay camiones registrados.
                        </td>
                    </tr>

                    <tr th:each="camion : ${camiones}">
                        <td th:text="${camion.idChofer != null ? camion.idChofer : 'Sin chofer asignado'}"></td>
                        <td class="fw-semibold" th:text="${camion.patente ?: '-'}"></td>
                        <td th:text="${camion.capacidadVolumen ?: '-'}"></td>
                        <td th:text="${camion.altura ?: '-'}"></td>
                        <td th:text="${camion.capacidadCarga ?: '-'}"></td>
                        <td th:text="${camion.disponible ?: '-'}"></td>

                        <td class="text-center">

                            <!-- Actualizar -->
                            <a th:href="@{/admin/camiones/editar/{patente}(patente=${camion.patente})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil-square"></i> Actualizar
                            </a>

                            <!-- Eliminar -->
                            <form th:action="@{/admin/camiones/{patente}(patente=${camion.patente})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Estás seguro de que querés eliminar este camión?')">

                                <input type="hidden" name="_method" value="DELETE">

                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </form>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-4">

        <!-- Planificar rutas -->
        <form th:action="@{/admin/PlanificacionRutas/planificar-manual}"
              method="post"
              onsubmit="return confirm('¿Deseás planificar las rutas ahora?')">

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-map me-2"></i>
                Planificar rutas
            </button>

        </form>

        <!-- Agregar camión -->
        <a th:href="@{/admin/camiones/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-2"></i>
            Agregar camión
        </a>

    </div>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Camiones — DonaTrack</title>
    <meta name="description" content="Zona de camiones">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<header class="admin-page-head">
    <div>
        <p class="eyebrow">Administración</p>
        <h1>Camiones</h1>
        <p class="admin-page-lead">Flota registrada y estado de disponibilidad.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/admin/camiones/nuevo}">Nuevo camión</a>
    <a class="btn btn-secondary" th:href="@{/admin}">Volver al panel</a>
</header>
<main class="main-admin" id="contenido" tabindex="-1">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Patente</th>
                        <th>Volumen</th>
                        <th>Altura</th>
                        <th>Capacidad de carga</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(camiones)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-truck fs-3 d-block mb-2"></i>
                            Todavía no hay camiones registrados.
                        </td>
                    </tr>
                    <tr th:each="camion : ${camiones}">
                        <td class="fw-semibold">
                            <span th:text="${camion.patente ?: '-'}">patente</span>
                        </td>
                        <td th:text="${camion.capacidadVolumen ?: '-'}">Volumen</td>
                        <td th:text="${camion.altura ?: '-'}">Altura</td>
                        <td th:text="${camion.capacidadCarga ?: '-'}">Capacidad de carga</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${camion.disponible == true ? ' text-bg-success' : ' text-bg-secondary'}"
                                  th:text="${camion.disponible == true ? 'Disponible' : 'Ocupado'}">Estado</span>
                        </td>
                        <td>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/camiones/{p}/editar(p=${camion.patente})}">Editar</a>
                            <form th:action="@{/admin/camiones/{p}/eliminar(p=${camion.patente})}" method="post" style="display:inline">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                            <form th:action="@{/admin/camiones/{p}/estado(p=${camion.patente})}" method="post" style="display:inline">
                                <input type="hidden" name="disponible" th:value="${camion.disponible == true ? 'false' : 'true'}">
                                <button class="btn btn-sm btn-outline-primary" type="submit"
                                        th:text="${camion.disponible == true ? 'Marcar ocupado' : 'Marcar disponible'}">Cambiar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

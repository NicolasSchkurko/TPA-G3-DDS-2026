<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Administración — DonaTrack</title>
    <meta name="description" content="Zona de administradores">
    <link rel="stylesheet" href="../../static/css/admin.css" th:href="@{/css/admin.css}">
</head>

<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<main class="main-admin" id="contenido" tabindex="-1">

    <h1 class="mensaje-administrador">Qué querés gestionar</h1>

    <div class="cuadricula">

        <a th:href="@{/donaciones}" class="item">
            <img src="../../static/images/donaciones.jpg"
                 th:src="@{/images/donaciones.jpg}"
                 alt="">
            <div>
                <h2>Donaciones</h2>
                <p>Revisá las donaciones registradas en el sistema</p>
            </div>
        </a>

        <a th:href="@{/admin/donantes}" class="item">
            <img src="../../static/images/donante.jpg"
                 th:src="@{/images/donante.jpg}"
                 alt="">
            <div>
                <h2>Donantes</h2>
                <p>Buscá, actualizá o importá los donantes registrados</p>
            </div>
        </a>

        <a th:href="@{/camiones}" class="item">
            <img src="../../static/images/camiones.jpg"
                 th:src="@{/images/camiones.jpg}"
                 alt="">
            <div>
                <h2>Camiones repartidores</h2>
                <p>Consultá la flota y su estado de disponibilidad</p>
            </div>
        </a>

    </div>

</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

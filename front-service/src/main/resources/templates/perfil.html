<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title th:text="${titulo} + ' — DonaTrack'">Mi espacio — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>
<main class="container my-5" id="contenido" tabindex="-1">
    <section class="card border-0 shadow-sm">
        <div class="card-body p-4 p-lg-5">
            <span class="badge text-bg-primary mb-3" th:text="${rol}">ROL</span>
            <h1 class="fw-bold" th:text="${titulo}">Mi espacio</h1>
            <p class="text-muted" th:text="${descripcion}">Descripción del perfil.</p>
            <p class="mb-0">Sesión iniciada como <strong th:text="${usuario}">usuario</strong>.</p>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

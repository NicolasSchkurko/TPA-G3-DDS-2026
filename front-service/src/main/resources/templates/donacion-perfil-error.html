<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil no disponible — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">
<main class="container">
    <section class="static-card border-0 mx-auto text-center" style="max-width: 560px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-danger fs-1 mb-3">
                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
            </div>
            <h1 class="h4 fw-bold">No pudimos habilitar la donación</h1>
            <p class="text-muted" role="alert" th:text="${error}">
                Tu cuenta no tiene un perfil de donante asociado.
            </p>
            <p th:if="${mostrarRegistro}">
                Para donar necesitás una cuenta con rol Donante y un perfil cuyo correo de contacto coincida con el de la cuenta.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/}">Volver al inicio</a>
                <a th:if="${mostrarRegistro}" class="btn btn-primary"
                   th:href="@{/register(tipoRegistro='DONANTE')}">
                    <i class="bi bi-person-plus me-1" aria-hidden="true"></i> Registrarse como donante
                </a>
                <a th:unless="${mostrarRegistro}" class="btn btn-primary" th:href="@{/realizar-donacion}">
                    Reintentar
                </a>
            </div>
        </div>
    </section>
</main>
</body>
</html>

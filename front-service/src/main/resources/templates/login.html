<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
<main class="container">
    <div class="static-card border-0 mx-auto" style="max-width: 420px">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="d-flex justify-content-start mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">
                    <i class="bi bi-house me-1" aria-hidden="true"></i> Volver
                </a>
            </div>
            <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px">
                <i class="bi bi-box-seam fs-3"></i>
            </div>
            <h1 class="h4 fw-bold">DonaTrack — Iniciar sesión</h1>
            <p class="text-muted small mb-4">Portal de Donaciones e Incentivos</p>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">No se pudo completar el inicio de sesión.</div>
            <a class="btn btn-primary w-100 py-2 fw-semibold" th:href="@{/oauth2/authorization/keycloak}">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar a DonaTrack
            </a>
            <p class="text-muted small mt-4 mb-0">La autenticación y los permisos son administrados por Keycloak.</p>
        </div>
    </div>
</main>
</body>
</html>

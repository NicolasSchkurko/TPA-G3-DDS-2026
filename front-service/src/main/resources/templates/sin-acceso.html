<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Sin acceso — DonaTrack</title>
    <meta name="description" content="Tu cuenta todavía no tiene un perfil asignado en DonaTrack.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app sin-acceso-page">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>

<main class="container py-5" id="contenido" tabindex="-1">
    <section class="card border-0 shadow-sm mx-auto p-4 p-md-5" style="max-width: 620px;"
             aria-labelledby="sinAccesoTitulo">
        <div class="empty-state" style="padding: 0;">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
                <circle cx="8" cy="5" r="2.6"/>
                <path d="M2.5 14c.6-2.8 2.8-4.2 5.5-4.2s4.9 1.4 5.5 4.2"/>
            </svg>
            <h1 class="h4 fw-bold mt-2 mb-1" id="sinAccesoTitulo">Tu cuenta no tiene un perfil asignado</h1>
            <p>Contactá a una persona administradora para que revise los roles de tu cuenta.</p>
            <a th:href="@{/}" class="btn btn-primary mt-3">Volver al inicio</a>
        </div>
    </section>
</main>

<p class="map-bg-credit">Fondo: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a></p>
<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

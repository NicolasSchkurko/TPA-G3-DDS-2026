<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <title>Sin acceso — DonaTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="app">
<div th:replace="~{fragments/app-shell :: appHeader}"></div>
<main class="container py-5" id="contenido" tabindex="-1">
    <div class="alert alert-warning">
        <h1 class="h4">Tu cuenta no tiene un perfil asignado</h1>
        <p>Contactá a una persona administradora para que revise los roles de tu cuenta.</p>
        <a th:href="@{/}" class="btn btn-outline-secondary">Volver al inicio</a>
    </div>
</main>

<div th:replace="~{fragments/app-shell :: appFooter}"></div>
</body>
</html>

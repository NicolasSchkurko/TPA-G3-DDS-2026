spring.application.name=donaciones-service
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8084}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Incluye /api: es el context-path de notificaciones, y el controller cuelga de /notificaciones.
# El cliente compone el sufijo /notificaciones, asi que la base debe terminar en /api.
servicio.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8083/api}
# Sin context-path: las rutas de incentivos ya empiezan con /api. El cliente compone
# /api/perfiles y /api/perfiles/donacion/{id} sobre esta base.
servicio.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
servicio.logisticas.url=${LOGISTICAS_URL:http://localhost:8086/api}

# --- Persistencia (MySQL) ---
# DB_URL / DB_USERNAME / DB_PASSWORD llegan del .env local (ver .env), que es lo que
# lee el compose por env_file. Usuario y clave van SIN default a proposito: con un default
# (:algo) estas lineas conectan igual cuando falta la variable, o sea que un deploy se levanta
# con la credencial que estaba escrita en el codigo en vez de fallar y delatar que le falta.
# DB_URL si mantiene el default de arriba, que no es una credencial: solo dice que base usar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donaciones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En desarrollo: Hibernate actualiza el esquema automáticamente en base a las entidades @Entity.
# Ir a Flyway/Liquibase más adelante si el TP lo requiere.
spring.jpa.hibernate.ddl-auto=update
# OSIV off: los read services abren su propia transacción y mapean a DTOs adentro.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Con context-path /api, la URL final de la UI es /api/api-docs.
springdoc.swagger-ui.path=/api-docs
# JSON de especificacion OpenAPI; URL final /api/v3/api-docs.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Configuración Listener RabbitMQ / Retry y Backoff (Punto 45) ---
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=3

# --- Timeouts HTTP Clientes de Integración (Punto 49) ---
http.client.connect-timeout-seconds=5
http.client.read-timeout-seconds=10

# --- Outbox de notificaciones a incentivos (Punto 76) ---
servicio.incentivos.outbox.intervalo-reintento-ms=30000
servicio.incentivos.outbox.retraso-inicial-ms=10000

# --- Geocoding con Georef (Punto 75) ---
# API pública, gratuita y sin key. El cliente usa POST /direcciones en lotes de hasta 1000.
servicio.georef.url=${GEOREF_URL:https://apis.datos.gob.ar/georef/api}
# Permite apagar la integración en demos/tests sin tocar código.
# Backfill nocturno: 00:30 para no competir con los schedulers de las 00:00.
geocoding.cron.cron=${GEOCODING_CRON:0 30 0 * * ?}
geocoding.cron.enabled=${GEOCODING_CRON_ENABLED:true}
geocoding.cron.max-por-corrida=${GEOCODING_CRON_MAX:1000}
geocoding.cron.reintento-dias=${GEOCODING_CRON_REINTENTO_DIAS:7}
geocoding.cron.intentos-maximos=${GEOCODING_CRON_INTENTOS_MAX:3}

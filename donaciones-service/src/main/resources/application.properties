spring.application.name=donaciones-service
spring.threads.virtual.enabled=true

server.servlet.context-path=/api
server.port=${SERVER_PORT:8084}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Incluye /api: es el context-path de notificaciones, y el controller cuelga de /notificaciones.
# El cliente compone el sufijo /notificaciones, asi que la base debe terminar en /api.
servicio.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8083/api}
# Sin context-path: las rutas de incentivos ya empiezan con /api. El cliente compone
# /api/perfiles y /api/perfiles/donacion/{id} sobre esta base.
servicio.incentivos.url=${INCENTIVOS_URL:http://localhost:8082}
servicio.logisticas.url=${LOGISTICAS_URL:http://localhost:8086/api}

# --- Persistencia (MySQL) ---
# Los valores reales de DB_URL / DB_USERNAME / DB_PASSWORD se cargan desde el .env local (ver .env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donaciones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=valentin
spring.datasource.password=10032001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En desarrollo: Hibernate actualiza el esquema automáticamente en base a las entidades @Entity.
# Ir a Flyway/Liquibase más adelante si el TP lo requiere.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
